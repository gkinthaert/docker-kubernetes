apiVersion: v1
kind: Pod
metadata:
  name: color-api
  namespace: dev
  labels:
    app: color-api
spec:
  containers:
    - name: color-api
      image: gkinthaert/color-api:1.1.0
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: color-api-svc
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: color-api
  ports:
    - port: 80
      targetPort: 80


# kubectl get pods -n [namespace]
# setting the default namespace:
# kubectl config current-context (to check)
# kubectl config set-context --current --namespace=dev
# kubectl get pod --all-namespaces