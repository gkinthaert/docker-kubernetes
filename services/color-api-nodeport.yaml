apiVersion: v1
kind: Service
metadata:
  name: color-api-nodeport
  labels:
    app: color-api
spec:
  type: NodePort
  selector:
    app: color-api
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 30007

# make sure all files are applied
# kubectl get services will show the NodePort now
# kubectl get nodes -o wide shows the minikube control plane IP
# on Windows and Mac we can't use this with the port we set up for NodePort
# minikube service color-api-nodeport --url
# this provides you with a url that you can use
# looks confusing because the port is not what you specifed, 
# but that is a wrapper done by minikube