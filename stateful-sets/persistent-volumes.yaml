apiVersion: v1
kind: PersistentVolume
metadata:
  name: ss-0 # create folder on minikube
spec:
  capacity:
    storage: 128Mi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  local:
    path: /mnt/disks/ss-0 # created on minikube!
  nodAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ['minikube']
