apiVersion: v1
kind: Pod
metadata:
  name: nginx-storage
  labels:
    app: nginx-storage
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
      - mountPath: /scratch
        name: scratch-volume
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  - name: busybox
    image: busybox
    command: ["/bin/sh", "-c"]
    args: ["sleep 1000"]
    volumeMounts:
      - mountPath: /scratch
        name: scratch-volume
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  volumes:
    - name: scratch-volume
      emptyDir:
        sizeLimit: 500Mi

# one pod two containers
# kubectl describe pod nginx-storage describes the pod
