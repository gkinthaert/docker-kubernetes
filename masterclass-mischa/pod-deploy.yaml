apiVersion: v1
kind: Pod
metadata:
  name: nginx-storage
  labels:
    app: nginx-storage
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
      - mountPath: /scratch
        name: scratch-volume
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  volumes:
    - name: scratch-volume
      emptyDir:
        sizeLimit: 500Mi