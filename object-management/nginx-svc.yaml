apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  labels:
    app: nginx
  annotations: 
    description: "Nginx service"
spec:
  type: NodePort
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: nginx

# kubectl equivalent command:
# kubectl expose pod nginx-pod --type=NodePort --port=80

